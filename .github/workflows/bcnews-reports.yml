name: bcnews digest & stats
on:
  schedule:
    # Daily digest: 9 PM WIB = 14:00 UTC
    - cron: "0 14 * * *"
    # Weekly: leaderboard + stats + report + export — Monday 8 AM WIB = 01:00 UTC
    - cron: "0 1 * * 1"
  workflow_dispatch:
    inputs:
      command:
        description: "Command to run"
        required: true
        type: choice
        options:
          - digest
          - stats
          - leaderboard
          - report
          - export
          - all
permissions:
  contents: read
concurrency:
  group: bcnews-reports-${{ github.ref_name }}
  cancel-in-progress: false
jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # The DB comes from the checkout, not from actions/cache: a prefix-matched
      # cache entry is an older snapshot, and reporting off it silently drops the
      # newest articles from the digest, stats and weekly PDF.
      - name: Checkout repository
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # ── Daily digest (9 PM WIB) ──
      - name: Run daily digest
        if: >-
          (github.event_name == 'schedule' && github.event.schedule == '0 14 * * *')
          || (github.event_name == 'workflow_dispatch' && (inputs.command == 'digest' || inputs.command == 'all'))
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_PRIVATE_CHAT_ID: ${{ secrets.TELEGRAM_PRIVATE_CHAT_ID }}
        run: python bc_news_update.py digest

      # ── Weekly stats (Monday 8 AM WIB) ──
      - name: Run weekly stats
        if: >-
          (github.event_name == 'schedule' && github.event.schedule == '0 1 * * 1')
          || (github.event_name == 'workflow_dispatch' && (inputs.command == 'stats' || inputs.command == 'all'))
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_PRIVATE_CHAT_ID: ${{ secrets.TELEGRAM_PRIVATE_CHAT_ID }}
        run: python bc_news_update.py stats

      # ── Weekly leaderboard ──
      - name: Run weekly leaderboard
        if: >-
          (github.event_name == 'schedule' && github.event.schedule == '0 1 * * 1')
          || (github.event_name == 'workflow_dispatch' && (inputs.command == 'leaderboard' || inputs.command == 'all'))
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_PRIVATE_CHAT_ID: ${{ secrets.TELEGRAM_PRIVATE_CHAT_ID }}
        run: python bc_news_update.py leaderboard

      # ── Weekly PDF report ──
      - name: Run weekly PDF report
        if: >-
          (github.event_name == 'schedule' && github.event.schedule == '0 1 * * 1')
          || (github.event_name == 'workflow_dispatch' && (inputs.command == 'report' || inputs.command == 'all'))
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_PRIVATE_CHAT_ID: ${{ secrets.TELEGRAM_PRIVATE_CHAT_ID }}
        run: python bc_news_update.py report

      # ── Weekly CSV export ──
      - name: Run CSV export
        if: >-
          (github.event_name == 'schedule' && github.event.schedule == '0 1 * * 1')
          || (github.event_name == 'workflow_dispatch' && (inputs.command == 'export' || inputs.command == 'all'))
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_PRIVATE_CHAT_ID: ${{ secrets.TELEGRAM_PRIVATE_CHAT_ID }}
        run: python bc_news_update.py export

      - name: Upload artifacts
        if: >-
          (github.event_name == 'schedule' && github.event.schedule == '0 1 * * 1')
          || (github.event_name == 'workflow_dispatch' && (inputs.command == 'export' || inputs.command == 'report' || inputs.command == 'all'))
        uses: actions/upload-artifact@v5
        with:
          name: bc-weekly-${{ github.run_id }}
          path: |
            bc_articles_export.csv
            bc_weekly_report.pdf
          retention-days: 14
          if-no-files-found: warn
